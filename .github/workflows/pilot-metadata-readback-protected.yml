name: Protected Schwab Pilot Metadata and Runtime Switch

on:
  workflow_call:
    inputs:
      resume_operation:
        type: string
        default: none
        required: false
      request_id:
        type: string
        default: ''
        required: false
    secrets:
      inventory:
        required: false
      runtime_target:
        required: false
      service:
        required: false
      services:
        required: false
      region:
        required: false
      target_enabled:
        required: false
      dry_run_only:
        required: false
      cash_only:
        required: false
      generic_cash_only:
        required: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  read_metadata:
    name: Schwab runtime operation · ${{ inputs.resume_operation }}
    concurrency:
      group: schwab-pilot-metadata-operation
      queue: max
    if: github.repository == 'QuantStrategyLab/CharlesSchwabPlatform' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reject a stale enable request
        if: inputs.resume_operation == 'enable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow="repos/${GITHUB_REPOSITORY}/actions/workflows/pilot-metadata-readback.yml"
          created=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .created_at)
          runs=$(gh api --method GET "$workflow/runs" -f branch=main -f "created=>=${created}" -F per_page=100)
          jq -e '.total_count == (.workflow_runs | length)' <<< "$runs" >/dev/null
          [[ "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]]
          newer=$(jq -r --argjson run_number "$GITHUB_RUN_NUMBER" '
            .workflow_runs[] | select(.run_number > $run_number)
            | select(.display_title != "Schwab runtime switch read-only") | .id' <<< "$runs")
          for run in $newer; do
            jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/jobs?per_page=100")
            # Until a newer request can be identified, leave the earlier enable unapplied.
            if ! jq -e '.total_count == (.jobs | length) and
                any(.jobs[]; .name | endswith("Schwab runtime operation · inspect")) and
                all(.jobs[]; .name | endswith("Schwab runtime operation · disable") | not)' <<< "$jobs" >/dev/null; then
              echo "::error::A newer Schwab switch request superseded this approval."
              exit 1
            fi
          done

      - name: Checkout reviewed source
        uses: actions/checkout@v6

      - name: Load original fixed cloud metadata source
        run: python3 -m scripts.diagnose_pilot_metadata --bootstrap-cloud-source

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install frozen dependencies
        run: uv sync --frozen --no-dev

      - name: Authenticate existing metadata reader
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Read existing serving metadata once
        if: ${{ inputs.resume_operation == 'none' }}
        env:
          CLOUD_RUN_SERVICE_TARGETS_JSON: ${{ secrets.inventory }}
          RUNTIME_TARGET_JSON: ${{ secrets.runtime_target }}
          CLOUD_RUN_SERVICE: ${{ secrets.service }}
          CLOUD_RUN_SERVICES: ${{ secrets.services }}
          CLOUD_RUN_REGION: ${{ secrets.region }}
          RUNTIME_TARGET_ENABLED: ${{ secrets.target_enabled }}
          SCHWAB_DRY_RUN_ONLY: ${{ secrets.dry_run_only }}
          SCHWAB_CASH_ONLY_EXECUTION: ${{ secrets.cash_only }}
          CASH_ONLY_EXECUTION: ${{ secrets.generic_cash_only }}
          PILOT_METADATA_RESULT_PATH: ${{ runner.temp }}/schwab-pilot-metadata.safe.json
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run --no-sync python -m scripts.diagnose_pilot_metadata

      - name: Save fixed safe projection
        if: ${{ always() && inputs.resume_operation == 'none' }}
        uses: actions/upload-artifact@v4
        with:
          name: schwab-pilot-metadata-safe
          path: ${{ runner.temp }}/schwab-pilot-metadata.safe.json
          if-no-files-found: error
          retention-days: 3

      - name: Inspect or synchronize the runtime switch
        if: ${{ inputs.resume_operation == 'inspect' || inputs.resume_operation == 'enable' || inputs.resume_operation == 'disable' }}
        env:
          CLOUD_RUN_SERVICE_TARGETS_JSON: ${{ secrets.inventory }}
          RUNTIME_TARGET_JSON: ${{ secrets.runtime_target }}
          CLOUD_RUN_SERVICE: ${{ secrets.service }}
          CLOUD_RUN_SERVICES: ${{ secrets.services }}
          CLOUD_RUN_REGION: ${{ secrets.region }}
          RUNTIME_TARGET_ENABLED: ${{ secrets.target_enabled }}
          RESUME_OPERATION: ${{ inputs.resume_operation }}
          RUNTIME_SWITCH_REQUEST_ID: ${{ inputs.request_id }}
          RUNTIME_SWITCH_RESULT_PATH: ${{ runner.temp }}/schwab-runtime-switch.safe.json
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run --no-sync python -m scripts.resume_schwab_single_state

      - name: Save fixed runtime switch receipt
        if: ${{ always() && inputs.resume_operation != 'none' }}
        uses: actions/upload-artifact@v4
        with:
          name: schwab-runtime-switch-safe
          path: ${{ runner.temp }}/schwab-runtime-switch.safe.json
          if-no-files-found: error
          retention-days: 3
