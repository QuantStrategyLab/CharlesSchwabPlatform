name: Protected Schwab Pilot Metadata Reader

on:
  workflow_call:
    secrets:
      inventory:
        required: false
      runtime_target:
        required: false
      service:
        required: false
      services:
        required: false
      region:
        required: false
      target_enabled:
        required: false
      dry_run_only:
        required: false
      cash_only:
        required: false
      generic_cash_only:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  read_metadata:
    if: github.repository == 'QuantStrategyLab/CharlesSchwabPlatform' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v6

      - name: Load original fixed cloud metadata source
        run: python3 -m scripts.diagnose_pilot_metadata --bootstrap-cloud-source

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install frozen dependencies
        run: uv sync --frozen --no-dev

      - name: Authenticate existing metadata reader
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Read existing serving metadata once
        env:
          CLOUD_RUN_SERVICE_TARGETS_JSON: ${{ secrets.inventory }}
          RUNTIME_TARGET_JSON: ${{ secrets.runtime_target }}
          CLOUD_RUN_SERVICE: ${{ secrets.service }}
          CLOUD_RUN_SERVICES: ${{ secrets.services }}
          CLOUD_RUN_REGION: ${{ secrets.region }}
          RUNTIME_TARGET_ENABLED: ${{ secrets.target_enabled }}
          SCHWAB_DRY_RUN_ONLY: ${{ secrets.dry_run_only }}
          SCHWAB_CASH_ONLY_EXECUTION: ${{ secrets.cash_only }}
          CASH_ONLY_EXECUTION: ${{ secrets.generic_cash_only }}
          PILOT_METADATA_RESULT_PATH: ${{ runner.temp }}/schwab-pilot-metadata.safe.json
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run --no-sync python -m scripts.diagnose_pilot_metadata

      - name: Save fixed safe projection
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: schwab-pilot-metadata-safe
          path: ${{ runner.temp }}/schwab-pilot-metadata.safe.json
          if-no-files-found: error
          retention-days: 3
