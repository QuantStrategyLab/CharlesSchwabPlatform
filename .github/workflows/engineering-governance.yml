name: Engineering governance

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
      - name: Scan added commits with redacted findings
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${PR_BASE:-$PUSH_BASE}"
          head="${PR_HEAD:-$PUSH_HEAD}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "No base commit is available for this event" >&2
            exit 1
          fi
          python3 scripts/retain_native_scan.py \
            --binary "$RUNNER_TEMP/gitleaks-bin/gitleaks" \
            --output "$RUNNER_TEMP/gitleaks-evidence/event-range" \
            --base "$base" --head "$head" --scope event-range
      - name: Retain the original contract review range retrospectively
        shell: bash
        env:
          REVIEW_BASE: 842acc62956b745df1725374913915dce25875a5
          REVIEW_HEAD: 3a4875b7494e687c8f9c703f45b4f4900be443d2
        run: |
          set -euo pipefail
          python3 scripts/retain_native_scan.py \
            --binary "$RUNNER_TEMP/gitleaks-bin/gitleaks" \
            --output "$RUNNER_TEMP/gitleaks-evidence/retrospective-review-range" \
            --base "$REVIEW_BASE" --head "$REVIEW_HEAD" --scope retrospective-review-range
          cp docs/evidence/offline-governance-review-v1.json "$RUNNER_TEMP/gitleaks-evidence/review-v1.json"
          cp docs/evidence/offline-governance-review-provenance.md "$RUNNER_TEMP/gitleaks-evidence/review-provenance.md"
      - name: Retain redacted native scan observations
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-governance-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/gitleaks-evidence/event-range/report.json
            ${{ runner.temp }}/gitleaks-evidence/event-range/scanner-exit.txt
            ${{ runner.temp }}/gitleaks-evidence/event-range/invocation.json
            ${{ runner.temp }}/gitleaks-evidence/event-range/capture.json
            ${{ runner.temp }}/gitleaks-evidence/retrospective-review-range/report.json
            ${{ runner.temp }}/gitleaks-evidence/retrospective-review-range/scanner-exit.txt
            ${{ runner.temp }}/gitleaks-evidence/retrospective-review-range/invocation.json
            ${{ runner.temp }}/gitleaks-evidence/retrospective-review-range/capture.json
            ${{ runner.temp }}/gitleaks-evidence/review-v1.json
            ${{ runner.temp }}/gitleaks-evidence/review-provenance.md

  commitlint:
    name: Commit message convention
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate pull request commit messages
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/governance-commitlint"
          npm install --prefix "$tool" --ignore-scripts --no-audit --no-fund \
            @commitlint/cli@21.2.4 @commitlint/config-conventional@21.2.4
          printf '%s\n' "module.exports = {extends: [require.resolve('@commitlint/config-conventional')]};" > "$tool/commitlint.config.cjs"
          node "$tool/node_modules/@commitlint/cli/cli.js" \
            --config "$tool/commitlint.config.cjs" --from "$PR_BASE" --to "$PR_HEAD" --verbose

  governance-contracts:
    name: Offline governance contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test offline evidence contracts without granting acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_gitleaks_report_evidence.py' -q
          python3 -m unittest discover -s tests -p 'test_ai_review_evidence.py' -q
          python3 -m unittest discover -s tests -p 'test_governance_evidence_gate.py' -q
          python3 -m unittest discover -s tests -p 'test_retain_native_scan.py' -q
