name: Engineering governance

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan added commits with redacted findings
        uses: Pigbibi/PrGovernance/pr-governance@18ad203d889f7ebea267afacaf48c9c204718b42
        with:
          mode: scan

  commitlint:
    name: Commit message convention
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate pull request commit messages
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/governance-commitlint"
          npm install --prefix "$tool" --ignore-scripts --no-audit --no-fund \
            @commitlint/cli@21.2.4 @commitlint/config-conventional@21.2.4
          printf '%s\n' "module.exports = {extends: [require.resolve('@commitlint/config-conventional')], defaultIgnores: true, ignores: [(message) => /^Merge /.test(message)], rules: {'subject-case': [0], 'header-max-length': [2, 'always', 72], 'type-enum': [2, 'always', ['feat', 'fix', 'docs', 'refactor', 'test', 'chore', 'perf', 'ci']]}};" > "$tool/commitlint.config.cjs"
          node "$tool/node_modules/@commitlint/cli/cli.js" \
            --config "$tool/commitlint.config.cjs" --from "$PR_BASE" --to "$PR_HEAD" --verbose

  governance-contracts:
    name: Offline governance contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test offline evidence contracts without granting acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_gitleaks_report_evidence.py' -q
          python3 -m unittest discover -s tests -p 'test_ai_review_evidence.py' -q
          python3 -m unittest discover -s tests -p 'test_governance_evidence_gate.py' -q
          python3 -m unittest discover -s tests -p 'test_retain_native_scan.py' -q
