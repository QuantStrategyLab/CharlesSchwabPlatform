name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install public configuration scanner
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ripgrep
          fi

      - name: Verify public configuration scanner failure behavior
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_public_runtime_configuration_scan.py -v

      - name: Reject public runtime configuration bindings
        id: public-config-scan
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            echo "ripgrep (rg) is required for the public configuration scan." >&2
            exit 127
          fi
          if rg -n '\$\{\{[[:space:]]*vars\.(GLOBAL_TELEGRAM_CHAT_ID|CLOUD_RUN_SERVICES|CLOUD_RUN_SERVICE|RUNTIME_HEARTBEAT_REQUIRED_SERVICES|RUNTIME_GUARD_SCHEDULER_JOB_PATTERN)([[:space:]]|\}\}|\|\|)' .github/workflows; then
            echo "Sensitive operational runtime configuration must use GitHub Secrets, not GitHub Variables." >&2
            exit 1
          else
            scan_status=$?
            if [ "$scan_status" -ne 1 ]; then
              echo "Public configuration scan failed (exit ${scan_status})." >&2
              exit "$scan_status"
            fi
          fi
          printf '%s\n' 'scan_completed=true' >> "$GITHUB_OUTPUT"
          echo "Public configuration scan completed without matches."

      - name: Assert public configuration scan completed
        if: ${{ always() }}
        env:
          PUBLIC_CONFIG_SCAN_OUTCOME: ${{ steps.public-config-scan.outcome }}
          PUBLIC_CONFIG_SCAN_COMPLETED: ${{ steps.public-config-scan.outputs.scan_completed }}
        run: |
          set -euo pipefail
          if [ "${PUBLIC_CONFIG_SCAN_OUTCOME:-}" != "success" ] ||
             [ "${PUBLIC_CONFIG_SCAN_COMPLETED:-}" != "true" ]; then
            echo "Public configuration scan completion was not verified." >&2
            exit 1
          fi

      - name: Resolve QuantPlatformKit ref
        id: quant-platform-kit-ref
        run: |
          set -euo pipefail
          ref="$(python3 - <<'PY'
          from pathlib import Path
          import re

          lockfile = Path("uv.lock").read_text(encoding="utf-8")
          refs = set(re.findall(r"QuantPlatformKit\.git\?rev=([a-f0-9]{40})", lockfile))
          if len(refs) != 1:
              raise SystemExit("uv.lock must contain exactly one QuantPlatformKit git ref")
          print(refs.pop())
          PY
          )"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Resolve UsEquityStrategies ref
        id: us-equity-strategies-ref
        run: |
          set -euo pipefail
          ref="$(python3 - <<'PY'
          from pathlib import Path
          import re

          lockfile = Path("uv.lock").read_text(encoding="utf-8")
          refs = set(re.findall(r"UsEquityStrategies\.git\?rev=([a-f0-9]{40})", lockfile))
          if len(refs) != 1:
              raise SystemExit("uv.lock must contain exactly one UsEquityStrategies git ref")
          print(refs.pop())
          PY
          )"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout QuantPlatformKit
        uses: actions/checkout@v6
        with:
          repository: QuantStrategyLab/QuantPlatformKit
          ref: ${{ steps.quant-platform-kit-ref.outputs.ref }}
          path: external/QuantPlatformKit

      - name: Checkout UsEquityStrategies
        uses: actions/checkout@v6
        with:
          repository: QuantStrategyLab/UsEquityStrategies
          ref: ${{ steps.us-equity-strategies-ref.outputs.ref }}
          path: external/UsEquityStrategies

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip uv
          uv sync --frozen --extra test

      - name: Verify frozen shared artifacts
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/frozen-shared-artifacts
        run: |
          set -euo pipefail
          uv sync --frozen --no-dev
          uv run --no-sync python -I scripts/verify_frozen_shared_artifacts.py --lockfile uv.lock

      - name: Smoke import pinned shared packages
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY'
          from quant_platform_kit.common.port_adapters import CallableNotificationPort, CallablePortfolioPort
          from us_equity_strategies import resolve_canonical_profile

          assert CallableNotificationPort
          assert CallablePortfolioPort
          assert resolve_canonical_profile("russell_top50_leader_rotation") == "russell_top50_leader_rotation"
          PY

      - name: Install editable shared repositories
        env:
          QPK_REF: ${{ steps.quant-platform-kit-ref.outputs.ref }}
          UES_REF: ${{ steps.us-equity-strategies-ref.outputs.ref }}
        run: |
          set -euo pipefail
          test "$(git -C external/QuantPlatformKit rev-parse HEAD)" = "${QPK_REF}"
          test "$(git -C external/UsEquityStrategies rev-parse HEAD)" = "${UES_REF}"
          uv pip install --no-deps -e external/QuantPlatformKit -e external/UsEquityStrategies

      - name: Run PAPER admission integration contract tests
        run: |
          set -euo pipefail
          uv run --no-sync pytest -q \
            tests/test_runtime_config_support.py::RuntimeConfigSupportTests::test_reads_schwab_dry_run_only_flag \
            tests/test_runtime_config_support.py::RuntimeConfigSupportTests::test_reads_runtime_target_enabled_flag \
            tests/test_runtime_composer.py \
            tests/test_build_cloud_run_env_sync_plan.py \
            tests/test_rebalance_service.py::RebalanceServiceTests::test_run_strategy_core_dry_run_skips_submit_and_marks_message \
            tests/test_rebalance_service.py::RebalanceServiceTests::test_run_strategy_skips_when_execution_marker_already_exists \
            tests/test_request_handling.py::RequestHandlingTests::test_handle_schwab_dry_run_uses_dry_run_override \
            tests/test_request_handling.py::RequestHandlingTests::test_handle_schwab_dry_run_stays_silent_when_market_closed \
            tests/test_runtime_broker_adapters.py \
            tests/test_signal_provenance.py \
            tests/test_trend_ma_window_required.py \
            tests/test_verify_image_ues_release_binding.py \
            tests/test_broker_reconciliation.py \
            tests/test_execution_uncertainty.py \
            tests/test_deployed_runtime_target_admission.py

      - name: Verify account facts publisher
        run: |
          set -euo pipefail
          uv run --no-sync pytest -q \
            tests/test_runtime_daily_report_projection.py \
            tests/test_publish_runtime_daily_from_reports.py \
            tests/test_run_runtime_daily_from_reports.py \
            tests/test_schwab_native_identity.py \
            tests/test_schwab_token_secret_readiness.py \
            tests/test_publish_account_facts_from_reports.py \
            tests/test_account_observation.py \
            tests/test_schwab_stock_inventory.py \
            tests/test_runtime_monitor_workflows.py \
            tests/test_rebalance_service.py

      - name: Verify notification results and delivery gates
        run: |
          set -euo pipefail
          uv run --no-sync pytest -q \
            tests/test_risk_gate_notification_result.py \
            tests/test_runtime_notification_i18n.py \
            tests/test_notifications.py \
            tests/test_notification_quiet.py \
            tests/test_notification_events.py \
            tests/test_compact_notification_adapter.py \
            tests/test_runtime_notification_adapters.py

      - name: Verify no-traffic deployment workflow
        run: |
          set -euo pipefail
          bash tests/test_safe_no_traffic_deploy_workflow.sh
          bash tests/test_sync_cloud_run_env_workflow.sh
          uv run --no-sync pytest -q tests/test_env_sync_drift_check.py

      - name: Verify daily digest evidence and full offline regression suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: .
        run: uv run --no-sync python -m pytest -q tests

      - name: Measure coverage against the production source layout
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: .
        run: |
          set -euo pipefail
          uv run --no-sync python -m coverage run -m pytest -q tests
          uv run --no-sync python -m coverage report --show-missing
          uv run --no-sync python - <<'PY'
          from coverage import CoverageData

          data = CoverageData(basename=".coverage")
          data.read()
          files = sorted(data.measured_files())
          if not files:
              raise SystemExit("coverage measured no files")
          for path in files:
              print(path)
          PY

      - name: Run ruff
        run: |
          set -euo pipefail
          uv run --no-sync ruff check --exclude external .

      - name: Check QPK pin consistency
        env:
          QPK_REF: ${{ steps.quant-platform-kit-ref.outputs.ref }}
        run: |
          set -euo pipefail
          test "$(git -C external/QuantPlatformKit rev-parse HEAD)" = "${QPK_REF}"
          printf '%s\n' "${QPK_REF}" > "$RUNNER_TEMP/qpk-pin"
          uv run --no-sync python external/QuantPlatformKit/scripts/check_qpk_pin_consistency.py \
            --root . \
            --pin-file "$RUNNER_TEMP/qpk-pin"

      - name: Ensure uv.lock matches pyproject.toml
        run: uv lock --check
