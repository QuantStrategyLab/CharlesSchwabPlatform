name: Notify Route Check (protected execution)

# Reusable secrets register the original private values before runner headers.
# No environment/secret/IAM/route changes; no Telegram message is sent.
on:
  workflow_call:
    secrets:
      GCP_PROJECT_ID:
        required: true
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT:
        required: true
      RUNTIME_GUARD_CLOUD_RUN_SERVICES:
        required: false
      CLOUD_RUN_SERVICE:
        required: false
      CLOUD_RUN_SERVICES:
        required: false
      CLOUD_RUN_SERVICE_TARGETS_JSON:
        required: false
      CLOUD_RUN_REGION:
        required: false
      TELEGRAM_TOKEN_SECRET_NAME:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  route-check:
    name: Telegram route identity (read-only)
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: ${{ secrets.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      RUNTIME_GUARD_CLOUD_RUN_SERVICES: ${{ secrets.RUNTIME_GUARD_CLOUD_RUN_SERVICES }}
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
      CLOUD_RUN_SERVICES: ${{ secrets.CLOUD_RUN_SERVICES }}
      CLOUD_RUN_SERVICE_TARGETS_JSON: ${{ secrets.CLOUD_RUN_SERVICE_TARGETS_JSON }}
      CLOUD_RUN_REGION: ${{ secrets.CLOUD_RUN_REGION }}
      TELEGRAM_TOKEN_SECRET_NAME: ${{ secrets.TELEGRAM_TOKEN_SECRET_NAME }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Observe serving Telegram binding (equality only)
        run: python3 scripts/notify_route_check.py
