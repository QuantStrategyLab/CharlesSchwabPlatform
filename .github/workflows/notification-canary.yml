name: Notification Canary

on:
  workflow_dispatch:
    inputs:
      canary_id:
        description: "Required nonempty id for this manual canary send; change it to send again."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: notification-canary-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  canary:
    name: Send one Telegram canary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: charlesschwabquant
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/401309731911/locations/global/workloadIdentityPools/github-actions/providers/github-main
      GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: schwab-platform-deploy@charlesschwabquant.iam.gserviceaccount.com
      CANARY_ID: ${{ inputs.canary_id }}
      NOTIFY_LANG: ${{ vars.NOTIFY_LANG || 'zh' }}
      GLOBAL_TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_TELEGRAM_CHAT_ID }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_TOKEN_SECRET_NAME: ${{ vars.TELEGRAM_TOKEN_SECRET_NAME }}
    steps:
      - name: Require nonempty canary_id
        run: |
          set -euo pipefail
          if [ -z "${CANARY_ID//[[:space:]]/}" ]; then
            echo "canary_id is required and must be nonempty" >&2
            exit 2
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install locked runtime dependencies
        run: |
          set -euo pipefail
          uv sync --frozen --no-dev

      - name: Authenticate to Google Cloud for existing Telegram secret access
        if: ${{ env.TELEGRAM_TOKEN == '' && env.TELEGRAM_TOKEN_SECRET_NAME != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - name: Set up gcloud for existing Telegram secret access
        if: ${{ env.TELEGRAM_TOKEN == '' && env.TELEGRAM_TOKEN_SECRET_NAME != '' }}
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Send one notification canary
        run: uv run --no-sync python scripts/send_notification_canary.py --canary-id "$CANARY_ID"
