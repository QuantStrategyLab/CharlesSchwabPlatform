name: Schwab Pilot Metadata and Runtime Switch
run-name: Schwab runtime switch ${{ inputs.request_id || 'read-only' }}

on:
  workflow_dispatch:
    inputs:
      resume_operation:
        description: Default read-only; enable and disable apply the existing runtime declaration.
        type: choice
        options: [none, inspect, enable, disable]
        default: none
      request_id:
        description: Lowercase UUID binding this runtime switch request and receipt.
        type: string
        required: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  approve-live:
    name: Approve Schwab live enable
    if: github.repository == 'QuantStrategyLab/CharlesSchwabPlatform' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.resume_operation == 'enable' && inputs.request_id != ''
    environment: schwab-live-approval
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Record live-enable approval
        run: echo "Approved the Schwab live-enable request for this run." >> "$GITHUB_STEP_SUMMARY"

  readback:
    needs: approve-live
    if: >-
      !cancelled() && github.repository == 'QuantStrategyLab/CharlesSchwabPlatform' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      ((inputs.resume_operation == 'enable' && needs.approve-live.result == 'success') ||
      (inputs.resume_operation != 'enable' && needs.approve-live.result == 'skipped'))
    uses: ./.github/workflows/pilot-metadata-readback-protected.yml
    with:
      resume_operation: ${{ inputs.resume_operation || 'none' }}
      request_id: ${{ inputs.request_id || '' }}
    # Named workflow secrets mask existing target and service values before step
    # headers. Only explicit enable/disable modes can change the live service.
    secrets:
      inventory: ${{ vars.CLOUD_RUN_SERVICE_TARGETS_JSON || secrets.CLOUD_RUN_SERVICE_TARGETS_JSON }}
      runtime_target: ${{ vars.RUNTIME_TARGET_JSON || secrets.RUNTIME_TARGET_JSON }}
      service: ${{ secrets.CLOUD_RUN_SERVICE }}
      services: ${{ secrets.CLOUD_RUN_SERVICES }}
      region: ${{ vars.CLOUD_RUN_REGION }}
      target_enabled: ${{ vars.RUNTIME_TARGET_ENABLED }}
      dry_run_only: ${{ vars.SCHWAB_DRY_RUN_ONLY }}
      cash_only: ${{ vars.SCHWAB_CASH_ONLY_EXECUTION }}
      generic_cash_only: ${{ vars.CASH_ONLY_EXECUTION }}
