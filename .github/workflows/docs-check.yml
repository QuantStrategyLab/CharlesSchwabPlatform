name: Documentation check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    uses: QuantStrategyLab/.github/.github/workflows/docs-acceptance.yml@ab32fb2d1306513f96ecefef5a0141840e920b2a
    with:
      policy-revision: b4966bdd8780cad3ae5154ae50d8b98259a16dc6
      mode: enforce

  docs:
    name: Documentation check
    needs: policy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require documentation policy acceptance
        run: test "${{ needs.policy.result }}" = "success"
