name: Documentation check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: QuantStrategyLab/.github/.github/workflows/docs-acceptance.yml@cbfe3aedf927a9cf73dfb7813e872b38d432b5a1
    with:
      policy-revision: cbfe3aedf927a9cf73dfb7813e872b38d432b5a1
      mode: enforce
