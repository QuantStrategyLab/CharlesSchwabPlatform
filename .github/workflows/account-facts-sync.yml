name: Schwab Account Facts Sync

on:
  workflow_dispatch:
    inputs:
      latest_report:
        description: Select the latest private report and verify its exact serving revision.
        required: false
        default: false
        type: boolean
      report_uri:
        description: Exact archived Schwab runtime report URI under the fixed SOXL prefix.
        required: false
        type: string
      expected_runtime_revision:
        description: Exact Cloud Run revision name expected in the report and service readback.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: schwab-account-facts-sync
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ secrets.SCHWAB_ACCOUNT_FACTS_GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.SCHWAB_ACCOUNT_FACTS_GCP_REGION }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.SCHWAB_ACCOUNT_FACTS_GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: ${{ secrets.SCHWAB_ACCOUNT_FACTS_GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require protected cloud configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_REGION GCP_WORKLOAD_IDENTITY_PROVIDER GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required"
              exit 2
            fi
          done

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Project and publish the selected archived report
        env:
          LATEST_REPORT: ${{ inputs.latest_report }}
          REPORT_URI: ${{ inputs.report_uri }}
          EXPECTED_RUNTIME_REVISION: ${{ inputs.expected_runtime_revision }}
          ACCOUNT_FACTS_SYNC_URL: ${{ vars.ACCOUNT_FACTS_SYNC_URL }}
          SCHWAB_NET_ASSETS_CURRENCY: ${{ vars.SCHWAB_NET_ASSETS_CURRENCY }}
          SCHWAB_CASH_CURRENCY: ${{ vars.SCHWAB_CASH_CURRENCY }}
          SCHWAB_ACCOUNT_FACTS_INCLUDE_POSITIONS: ${{ vars.SCHWAB_ACCOUNT_FACTS_INCLUDE_POSITIONS || 'false' }}
          SCHWAB_ACCOUNT_FACTS_TARGET_ID: ${{ secrets.SCHWAB_ACCOUNT_FACTS_TARGET_ID }}
          SCHWAB_ACCOUNT_FACTS_REPORT_PREFIX: ${{ secrets.SCHWAB_ACCOUNT_FACTS_REPORT_PREFIX }}
          SCHWAB_ACCOUNT_FACTS_SERVICE_NAME: ${{ secrets.SCHWAB_ACCOUNT_FACTS_SERVICE_NAME }}
          SCHWAB_ACCOUNT_FACTS_SYNC_TOKEN: ${{ secrets.SCHWAB_ACCOUNT_FACTS_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$LATEST_REPORT" == "true" ]]; then
            if [[ -n "$REPORT_URI" || -n "$EXPECTED_RUNTIME_REVISION" ]]; then
              echo "skipped:conflicting_source_selection"
              exit 2
            fi
            python3 scripts/publish_account_facts_from_reports.py --latest-report
          else
            python3 scripts/publish_account_facts_from_reports.py \
              --report-uri "$REPORT_URI" \
              --expected-runtime-revision "$EXPECTED_RUNTIME_REVISION"
          fi
