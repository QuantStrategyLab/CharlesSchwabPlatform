name: Schwab Pilot State Readback

on:
  workflow_dispatch:
    inputs:
      inspect_historical_outcome:
        description: Inspect a bounded existing-report window for one rejected outcome; no broker or writes.
        type: boolean
        required: false
        default: false
      inspect_outcome_origin:
        description: Inspect metadata and bounded AuditLog clues for one already-rejected outcome; no financial body export or recovery.
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: schwab-pilot-state-readback
  cancel-in-progress: false

jobs:
  read_state:
    if: github.repository == 'QuantStrategyLab/CharlesSchwabPlatform' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    uses: ./.github/workflows/pilot-state-readback-protected.yml
    with:
      inspect_historical_outcome: ${{ inputs.inspect_historical_outcome || false }}
      inspect_outcome_origin: ${{ inputs.inspect_outcome_origin || false }}
    # Original sources become named secrets before any runner step header.
    secrets:
      inventory: ${{ vars.CLOUD_RUN_SERVICE_TARGETS_JSON || secrets.CLOUD_RUN_SERVICE_TARGETS_JSON }}
      runtime_target: ${{ vars.RUNTIME_TARGET_JSON || secrets.RUNTIME_TARGET_JSON }}
      service: ${{ secrets.CLOUD_RUN_SERVICE }}
      services: ${{ secrets.CLOUD_RUN_SERVICES }}
      region: ${{ vars.CLOUD_RUN_REGION }}
