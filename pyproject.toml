[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "charles-schwab-platform"
version = "0.3.0"
description = "QuantStrategyLab platform layer for Charles Schwab broker."
requires-python = ">=3.11"
dependencies = [
    "flask",
    "gunicorn",
    "pandas",
    "requests",
    "pandas-market-calendars",
    "pytz",
    "schwab-py",
    "google-cloud-secret-manager",
    "google-cloud-storage",
    "google-auth",
    "numpy",
    "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@03c93207d34a081cbecf04782fdc880e570709fb",
    "us-equity-strategies @ git+https://github.com/QuantStrategyLab/UsEquityStrategies.git@3f112f5352efe677a0c480c4ab621b8ea3e85336",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
schwab-d1-no-order-acceptance = "charles_schwab_platform.entrypoints.d1_no_order_acceptance:main"

[tool.coverage.run]
branch = true
source = ["src/charles_schwab_platform"]
omit = ["tests/*", "*/external/*", ".venv/*", "build/*", "dist/*", "release-overlays/*", "research/*"]

[tool.coverage.report]
show_missing = true
include_namespace_packages = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
charles_schwab_platform = ["notifications/*.json", "notifications/digest_snapshot/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.uv]
override-dependencies = [
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@03c93207d34a081cbecf04782fdc880e570709fb",
]
